<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>予約ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --border: #2a2a4a;
      --accent: #4f8ef7;
      --accent-dim: #2a4a8a;
      --danger: #e74c3c;
      --success: #2ecc71;
      --warn: #f39c12;
      --text: #e0e0f0;
      --muted: #8888aa;
      --input-bg: #0f0f1a;
      --radius: 12px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* ===== Header ===== */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
      flex: 1;
    }
    #btn-logout {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 10px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
      flex-shrink: 0;
    }
    #status-dot.running { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ===== Main content ===== */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ===== Card ===== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    /* ===== Form ===== */
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="password"],
    input[type="date"],
    input[type="number"],
    input[type="url"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    input:focus { border-color: var(--accent); }
    input[type="number"] { -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button { opacity: 1; }

    /* ===== Buttons ===== */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      border-radius: var(--radius);
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: var(--accent); color: #fff; }
    .btn-stop  { background: var(--danger); color: #fff; }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .btn { flex: 1; }

    /* ===== Log area ===== */
    #log-wrap {
      flex: 1;
      min-height: 220px;
      background: #0a0a14;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    .log-header span { font-size: 12px; color: var(--muted); font-weight: 600; }
    #btn-clear-log {
      font-size: 12px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
    }
    #log-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      font-family: "Menlo", "Consolas", monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-line { color: #ccd6f6; }
    .log-line.ok    { color: var(--success); }
    .log-line.error { color: var(--danger); }
    .log-line.warn  { color: var(--warn); }
    .log-line.end   { color: #fff; font-weight: bold; }
    .log-line.info  { color: #88aaff; }

    /* ===== Toast ===== */
    #toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 20px);
      left: 50%;
      transform: translateX(-50%);
      background: #333355;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>札幌体育館 自動予約</h1>
  <button id="btn-logout" onclick="logout()" style="display:none">ログアウト</button>
</header>

<main>

  <!-- 設定カード -->
  <div class="card">
    <div class="card-title">設定</div>

    <div class="field">
      <label for="f-date">予約日</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label for="f-uid">ログインID</label>
      <input type="text" id="f-uid" autocomplete="username" inputmode="email">
    </div>
    <div class="field">
      <label for="f-pw">パスワード</label>
      <input type="password" id="f-pw" autocomplete="current-password">
    </div>
    <div class="field">
      <label for="f-purpose">利用目的（スポーツ名）</label>
      <input type="text" id="f-purpose" placeholder="バレーボール">
    </div>
    <div class="field">
      <label for="f-people">利用人数</label>
      <input type="number" id="f-people" min="1" max="100" value="16">
    </div>
    <div class="field">
      <label for="f-discord">Discord Webhook URL（任意）</label>
      <input type="url" id="f-discord" placeholder="https://discord.com/api/webhooks/...">
    </div>
    <div class="field">
      <label for="f-interval">監視間隔（秒）</label>
      <input type="number" id="f-interval" min="5" max="60" value="5">
    </div>
  </div>

  <!-- ボタン -->
  <div class="btn-row">
    <button class="btn btn-start" id="btn-start" onclick="startJob()">▶ 開始</button>
    <button class="btn btn-stop"  id="btn-stop"  onclick="stopJob()" disabled>■ 停止</button>
  </div>

  <!-- ログ -->
  <div id="log-wrap">
    <div class="log-header">
      <span>ログ</span>
      <button id="btn-clear-log" onclick="clearLog()">クリア</button>
    </div>
    <div id="log-body"></div>
  </div>

</main>

<div id="toast"></div>

<script>
  // ===== 状態 =====
  let logOffset = 0;
  let pollTimer = null;
  let isRunning = false;

  // ===== 起動時: 設定・ステータス読み込み =====
  async function init() {
    // 保存済み設定を読み込む
    try {
      const res = await fetch("/api/config");
      if (res.ok) {
        const cfg = await res.json();
        if (cfg.target_date) document.getElementById("f-date").value = cfg.target_date;
        if (cfg.user_id)     document.getElementById("f-uid").value = cfg.user_id;
        if (cfg.purpose)     document.getElementById("f-purpose").value = cfg.purpose;
        if (cfg.num_people)  document.getElementById("f-people").value = cfg.num_people;
        if (cfg.discord_webhook) document.getElementById("f-discord").value = cfg.discord_webhook;
        if (cfg.interval_sec)    document.getElementById("f-interval").value = cfg.interval_sec;
      }
    } catch(e) {}

    // ステータス確認（既に実行中なら監視再開）
    await refreshStatus();
    startPolling();
  }

  // ===== ポーリング =====
  function startPolling() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(tick, 1000);
  }

  async function tick() {
    await fetchLogs();
    await refreshStatus();
  }

  // ===== ステータス更新 =====
  async function refreshStatus() {
    try {
      const res = await fetch("/api/status");
      const data = await res.json();
      setRunning(data.running);
    } catch(e) {}
  }

  function setRunning(running) {
    isRunning = running;
    const dot  = document.getElementById("status-dot");
    const btnS = document.getElementById("btn-start");
    const btnX = document.getElementById("btn-stop");
    dot.className = running ? "running" : "";
    btnS.disabled = running;
    btnX.disabled = !running;
  }

  // ===== ログ取得 =====
  async function fetchLogs() {
    try {
      const res = await fetch(`/api/logs?since=${logOffset}`);
      const data = await res.json();
      if (data.logs && data.logs.length > 0) {
        appendLogs(data.logs);
        logOffset = data.total;
      }
    } catch(e) {}
  }

  function appendLogs(lines) {
    const body = document.getElementById("log-body");
    const atBottom = body.scrollHeight - body.scrollTop <= body.clientHeight + 40;

    lines.forEach(line => {
      const div = document.createElement("div");
      div.className = "log-line" + lineClass(line);
      div.textContent = line;
      body.appendChild(div);
    });

    if (atBottom) body.scrollTop = body.scrollHeight;
  }

  function lineClass(line) {
    if (line.includes("[END]"))   return " end";
    if (line.includes("[OK]"))    return " ok";
    if (line.includes("[Error]")) return " error";
    if (line.includes("[Warn]"))  return " warn";
    if (line.includes("[Info]"))  return " info";
    return "";
  }

  function clearLog() {
    document.getElementById("log-body").innerHTML = "";
    // offset はリセットしない（サーバー側ログはそのまま）
  }

  // ===== 開始 =====
  async function startJob() {
    const date    = document.getElementById("f-date").value.trim();
    const uid     = document.getElementById("f-uid").value.trim();
    const pw      = document.getElementById("f-pw").value;
    const purpose = document.getElementById("f-purpose").value.trim() || "バレーボール";
    const people  = parseInt(document.getElementById("f-people").value) || 16;
    const discord = document.getElementById("f-discord").value.trim();
    const interval= Math.max(5, parseInt(document.getElementById("f-interval").value) || 5);

    if (!date)  return toast("予約日を入力してください");
    if (!uid)   return toast("ログインIDを入力してください");
    if (!pw)    return toast("パスワードを入力してください");

    try {
      const res = await fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          target_date: date,
          user_id: uid,
          password: pw,
          purpose,
          num_people: people,
          discord_webhook: discord,
          interval_sec: interval,
        }),
      });
      const data = await res.json();
      if (data.ok) {
        setRunning(true);
        logOffset = 0;
        clearLog();
        toast("監視を開始しました");
      } else {
        toast("エラー: " + (data.error || "不明"));
      }
    } catch(e) {
      toast("通信エラー: " + e.message);
    }
  }

  // ===== 停止 =====
  async function stopJob() {
    try {
      await fetch("/api/stop", { method: "POST" });
      setRunning(false);
      toast("停止しました");
    } catch(e) {
      toast("通信エラー: " + e.message);
    }
  }

  // ===== トースト =====
  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
  }

  // ===== ログアウト =====
  async function logout() {
    await fetch("/api/logout", { method: "POST" });
    window.location.href = "/login";
  }

  // ===== ログアウトボタン: PIN設定済み時のみ表示 =====
  async function checkPinEnabled() {
    try {
      const res = await fetch("/api/status");
      if (res.status === 401) {
        // 認証が必要 = PIN設定済み → ログアウトボタン表示
        document.getElementById("btn-logout").style.display = "block";
        window.location.href = "/login";
        return;
      }
      // 200 = ログイン済みかPIN未設定
      const res2 = await fetch("/api/config");
      if (res2.ok) {
        // ログアウトボタンは /login へ戻れる場合のみ表示
        // (セッションがある = PIN設定済みでログイン中)
        if (document.cookie.includes("session")) {
          document.getElementById("btn-logout").style.display = "block";
        }
      }
    } catch(e) {}
  }

  // ===== 初期化 =====
  checkPinEnabled();
  init();
</script>
</body>
</html>
